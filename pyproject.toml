[project]
name = "Koroto"
version = "0.1.0"
description = "A collection orchestration and decision-support system for Pokémon TCG Pocket."
readme = "README.md"
authors = [
    { name = "Max Shouman", email = "shouman.max@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
koroto = "koroto:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
]
